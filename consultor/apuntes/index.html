<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><title>Apuntes | Consultor</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&family=Jost:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
<style>
:root{--gold:#E5B95C;--light:#F1D18A;--ink:#F3F0EA;--bg:#0B0A09;--panel:#11100E;--line:#A97A2F55}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 Outfit,Arial,sans-serif}.toolbar{position:sticky;top:0;z-index:5;background:var(--panel);border-bottom:1px solid var(--line);padding:16px 24px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}.toolbar h1{font-size:18px;font-weight:600;margin:0 auto 0 0}button,select{font:400 14px Outfit,Arial,sans-serif;color:var(--gold);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:9px 12px;cursor:pointer}button:hover{border-color:var(--gold);color:var(--light)}button:focus-visible,select:focus-visible{outline:2px solid var(--gold);outline-offset:3px}.divider{height:24px;border-left:1px solid var(--line);margin:0 4px}.status{font-size:13px;color:var(--light);padding:10px 24px;min-height:40px}main{max-width:596pt;margin:0 auto 64px;padding:24px 72pt 64px;min-height:70vh} .signature{font-size:11px;letter-spacing:.25em;text-transform:uppercase;color:var(--gold);border-bottom:1px solid var(--line);padding-bottom:22px;margin-bottom:36px}.title{font-size:36px;line-height:1.15;letter-spacing:-.03em;font-weight:500;margin-bottom:18px}.meta{display:grid;grid-template-columns:1fr 1fr;gap:22px;padding-bottom:26px;border-bottom:1px solid var(--line);margin-bottom:28px}label{display:block;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);margin-bottom:7px}.field{min-height:24px;overflow-wrap:anywhere}[contenteditable]:focus{outline:1px dashed var(--line);outline-offset:6px}.notes{min-height:440px;font-size:11pt;line-height:1.5;overflow-wrap:anywhere}.notes h2{font-size:17pt;font-weight:500;color:var(--gold);margin:26px 0 12px}.notes p{margin:0 0 10pt}.notes:empty:before,.field:empty:before{content:attr(data-placeholder);color:#b9aa9977;pointer-events:none}.hint{font-size:12px;color:#b9aa99;margin-top:40px;border-top:1px solid var(--line);padding-top:16px} @media(max-width:840px){main{padding:24px 22px 48px}.toolbar{padding:12px}.toolbar h1{width:100%;margin-bottom:4px}.meta{grid-template-columns:1fr}.title{font-size:30px}}@media print{@page{size:A4;margin:22mm}body{background:white;color:#111}.toolbar,.status,.hint{display:none}main{max-width:none;padding:0;margin:0;min-height:0}.notes{min-height:0}.signature,label,.notes h2{color:#805c20}.meta,.signature{border-color:#bba575}[contenteditable]:focus{outline:none}[contenteditable]:empty:before{content:none}h2{break-after:avoid}p,li{orphans:3;widows:3}}
</style></head><body>
<header class="toolbar"><h1>• Apuntes</h1><button type="button" data-cmd="undo" aria-label="Deshacer">↶</button><button type="button" data-cmd="redo" aria-label="Rehacer">↷</button><span class="divider"></span><select id="block" aria-label="Formato del párrafo"><option value="p">Texto</option><option value="h2">Subtítulo</option></select><button type="button" data-cmd="bold" aria-label="Negrita"><b>B</b></button><button type="button" data-cmd="italic" aria-label="Cursiva"><i>C</i></button><button type="button" data-cmd="insertUnorderedList">Viñetas</button><span class="divider"></span><button type="button" id="download">Descargar HTML</button><button type="button" id="print">Imprimir / PDF</button></header>
<div id="status" class="status" role="status" aria-live="polite">Listo para escribir.</div>
<main><div class="signature">Fernando Guajardo · Consultor Organizacional</div><div id="title" class="title field" role="textbox" aria-label="Título del apunte" contenteditable="true" data-placeholder="Título del apunte"></div><div class="meta"><div><label id="date-label">Fecha</label><div id="date" class="field" role="textbox" aria-labelledby="date-label" contenteditable="true" data-placeholder="Día / mes / año"></div></div><div><label id="context-label">Tema / contexto</label><div id="context" class="field" role="textbox" aria-labelledby="context-label" contenteditable="true" data-placeholder="Reunión, lectura, proyecto…"></div></div></div><div id="notes" class="notes" role="textbox" aria-label="Cuerpo de los apuntes" aria-multiline="true" contenteditable="true" data-placeholder="Empezá a escribir acá…"></div><p class="hint">El borrador se guarda en este navegador. Descargá el HTML para conservar una copia con tus apuntes.</p></main>
<script>
(function(){
'use strict';
const ids=['title','date','context','notes'],key='kairos-consultor-apuntes-v1',status=document.getElementById('status');
let range=null;
const fields=ids.map(id=>document.getElementById(id));
const initial=fields.map(e=>e.innerHTML);
try{const saved=JSON.parse(localStorage.getItem(key)||'null');if(saved&&initial.every(s=>!s.trim())){fields.forEach(e=>{if(typeof saved[e.id]==='string')e.innerHTML=saved[e.id]});status.textContent='Borrador recuperado de este navegador.'}}catch(e){status.textContent='Descargá el HTML para conservar tus apuntes.'}
function save(){try{const data={};fields.forEach(e=>data[e.id]=e.innerHTML);localStorage.setItem(key,JSON.stringify(data));status.textContent='Borrador guardado en este navegador.'}catch(e){status.textContent='No se pudo guardar el borrador. Usá Descargar HTML.'}}
fields.forEach(e=>e.addEventListener('input',save));
document.addEventListener('selectionchange',()=>{const s=getSelection();if(s.rangeCount&&fields.some(e=>e.contains(s.anchorNode)&&e.contains(s.focusNode)))range=s.getRangeAt(0).cloneRange()});
function restore(){if(range){const s=getSelection();s.removeAllRanges();s.addRange(range)}else document.getElementById('notes').focus()}
document.querySelectorAll('[data-cmd]').forEach(b=>{b.addEventListener('mousedown',e=>e.preventDefault());b.onclick=()=>{restore();document.execCommand(b.dataset.cmd,false,null);save()}});
document.getElementById('block').onchange=e=>{restore();document.execCommand('formatBlock',false,e.target.value);save()};
document.getElementById('print').onclick=()=>window.print();
document.getElementById('download').onclick=()=>{const clone=document.documentElement.cloneNode(true);clone.querySelector('#status').textContent='Copia guardada. Podés seguir escribiendo.';const blob=new Blob(['<!doctype html>\n'+clone.outerHTML],{type:'text/html;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=(document.getElementById('title').textContent.trim().replace(/[^\p{L}\p{N} _-]/gu,'').slice(0,70)||'Apuntes')+'.html';a.click();setTimeout(()=>URL.revokeObjectURL(url),2000);status.textContent='HTML descargado con tus apuntes.'};
})();
</script></body></html>
